<div id="e-waste-atlas"><template shadowrootmode="open"><style>

*{box-sizing:border-box}.pa{margin:0;background:radial-gradient(circle at 15% 0,#d2e9f0 0,transparent 28%),var(--bg);color:var(--text);font-family:inherit;line-height:1.5}
a{color:var(--teal)}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
.top{position:sticky;top:0;z-index:9;background:#eaf3f6d9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #10293a14}.nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.03em;display:flex;align-items:center}.brand-text{display:flex;flex-direction:column;line-height:1.15}.brand small{font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted)}
.brand .logo{flex-shrink:0;width:32px;height:32px;margin-right:11px}
.nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:13px}.nav a:hover{color:var(--teal)}.nav a.lab-link{margin-left:0;font-size:inherit;color:inherit;text-decoration:underline;text-decoration-color:#536b7866;text-underline-offset:2px}.nav a.lab-link:hover{color:var(--teal)}
/* clock */
.waste-clock-section{padding:28px 0 0}.waste-clock{position:relative;overflow:hidden;border:1px solid #b4d3de;border-radius:24px;background:linear-gradient(115deg,#d9edf3,#f7fbfc 72%);padding:26px 28px;display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:center}.waste-clock:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-95px;top:-145px;background:#0e8a8f12;pointer-events:none}
.clock-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--copper)}.clock-number{font-variant-numeric:tabular-nums;font-size:clamp(46px,7vw,82px);line-height:.95;letter-spacing:-.055em;font-weight:850;margin:9px 0 6px}.clock-number span{font-size:.29em;letter-spacing:0;color:var(--muted);font-weight:650;margin-left:8px}.clock-copy{color:#46606d;font-size:14px;max-width:690px}
.clock-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:18px}.clock-stat{border-top:1px solid #b4d3de;padding-top:11px}.clock-stat b{display:block;font-size:clamp(24px,2.6vw,32px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.clock-stat small{color:#66808c;font-size:13px}
.leak-clock{border-left:1px solid #b4d3de;padding-left:24px;position:relative;z-index:1}.leak-clock strong{display:block;font-size:clamp(30px,4vw,46px);letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--copper)}.leak-clock span{color:#66808c;font-size:12px}
.clock-progress{height:5px;background:#10293a12;border-radius:99px;overflow:hidden;margin-top:18px}.clock-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px}.clock-source{display:block;margin-top:10px;color:#76909b;font-size:10px}
/* hero */
.hero{padding:90px 0 58px;display:grid;grid-template-columns:1.08fr .92fr;gap:48px;align-items:center}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:var(--teal)}h1{font-size:clamp(50px,7vw,84px);line-height:.95;letter-spacing:-.065em;margin:14px 0 20px}h2{font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.045em;margin:8px 0 10px}.lead{font-size:19px;color:#3c5664;max-width:650px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.pill{padding:8px 11px;border:1px solid #b4d3de;border-radius:999px;color:#3c5664;font-size:12px}
.visual{height:430px;border:1px solid #bcd7e0;border-radius:28px;background:linear-gradient(160deg,#d9edf3,#f4f9fb);position:relative;overflow:hidden;box-shadow:0 25px 80px #1b4a5a22}.visual svg.pcb{position:absolute;inset:0;width:100%;height:100%}
.pcb .tr{fill:none;stroke:#0e8a8f;stroke-width:2;opacity:.35}.pcb .pad{fill:#e0a93b}.pcb .via{fill:#fff;stroke:#0e8a8f;stroke-width:2;opacity:.6}.pcb .chip{fill:#10293a}.pcb .pin{fill:#c0652a}.pcb .pulse{fill:none;stroke:#e0a93b;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 400;animation:run 5s linear infinite}.pcb .pulse.p2{stroke:#55c3df;animation-duration:6.5s;animation-delay:-2s}.pcb .pulse.p3{stroke:#c0652a;animation-duration:7.5s;animation-delay:-4s}
@keyframes run{to{stroke-dashoffset:-414}}@media (prefers-reduced-motion:reduce){.pcb .pulse{animation:none;opacity:0}}
.float{position:absolute;background:#ffffffd9;border:1px solid #10293a1a;border-radius:15px;padding:13px 15px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.float b{display:block;font-size:23px}.float span{font-size:11px;color:var(--muted)}.f1{right:22px;top:22px}.f2{left:22px;bottom:30px}
/* generic */
.section{padding:72px 0}.head{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:28px}.head p{max-width:500px;color:var(--muted);margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{border-top:1px solid #b4d3de;padding-top:16px}.kpi strong{display:block;font-size:clamp(36px,5vw,52px);letter-spacing:-.04em;line-height:1.1}.kpi span{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.kpi .ki{width:22px;height:22px;flex:none;fill:none;stroke:var(--teal);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel{border:1px solid var(--line);background:linear-gradient(180deg,#ffffff,var(--soft2));border-radius:22px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
/* tiles */
.tilegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;align-content:start}.tile{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;min-height:118px;color:var(--text);text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:stretch}.tile:hover,.tile.active{background:#e1f0f4;border-color:#3aa3a8}.tile b{font-size:17px;display:block;line-height:1.2}.tile em{font-style:normal;color:var(--teal);font-size:12px;font-weight:600}.tile small{display:block;color:#66808c;margin-top:8px;font-size:12px}.tile .ico{width:30px;height:30px;color:var(--teal);margin-bottom:8px}
.elgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start}.el{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px 10px;cursor:pointer;font:inherit;color:var(--text);text-align:left;min-height:104px;display:flex;flex-direction:column}.el:hover,.el.active{background:#e1f0f4;border-color:#3aa3a8}.el .z{font-size:10px;color:var(--muted)}.el .sym{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:4px 0 3px}.el .nm{font-size:11px;color:var(--muted)}.el .q{margin-top:auto;font-size:11px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}.el.hz .sym{color:#b3412f}.el.hz .q{color:#b3412f}
.el-key{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}.el-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.detail h3{font-size:31px;margin:8px 0;letter-spacing:-.03em;line-height:1.05}.big{font-size:60px;font-weight:800;letter-spacing:-.06em;color:var(--teal);line-height:1.05}.big small{font-size:.35em;letter-spacing:0;color:var(--muted);font-weight:600;margin-left:6px}
.barline{height:11px;background:#d6e8ee;border-radius:99px;overflow:hidden}.barline i{display:block;height:100%;background:var(--teal)}
.rate{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:16px 0 6px}.rate b{color:var(--text)}
.facts{margin-top:18px;padding-top:16px;border-top:1px solid #d6e8ee}.facts dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:10px 0 0;font-size:13px}.facts dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}.facts dd{margin:0}.facts-note{margin:12px 0 0;font-size:11px;color:#76909b}
.el-photo{margin:16px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}.el-photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#dcecf1}.el-photo figcaption{font-size:12.5px;line-height:1.4;color:var(--text);padding:9px 12px 10px}.el-photo .cr{display:block;font-size:10.5px;color:#76909b;margin-top:3px}.el-photo .cr a{color:inherit}
.symbig{display:flex;align-items:center;gap:14px;margin:6px 0 10px}.symbox{width:74px;height:74px;border-radius:14px;border:1.5px solid var(--teal);display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--teal);flex-shrink:0}.symbox span{font-size:10px;color:var(--muted)}.symbox b{font-size:30px;line-height:1;letter-spacing:-.04em}.symbox.hz{border-color:#b3412f;color:#b3412f}.symbig .tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:#e1f0f4;color:var(--tealD);font-weight:600}.tag.hz{background:#fbe6df;color:#a03a24}.tag.crm{background:#fbf0d6;color:#8a5a00}
/* composition */
.comp{display:flex;height:54px;border-radius:14px;overflow:hidden;margin:6px 0 10px}.comp div{display:flex;flex-direction:column;justify-content:center;padding:0 14px;color:#fff;min-width:0}.comp b{font-size:18px;line-height:1.1}.comp span{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:22px}.vcard{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px}.vcard b{font-size:26px;display:block;letter-spacing:-.03em}.vcard span{font-size:12px;color:var(--muted)}
/* chart */
.switch{display:flex;gap:4px;background:#dcecf1;border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%;margin-bottom:16px;flex-wrap:wrap}.switch button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}.switch button.active{background:#fff;color:var(--text);font-weight:600}.switch button:disabled{opacity:.35;cursor:not-allowed}
.chart{height:300px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line)}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px;min-width:0}.bar{width:min(54px,70%);background:linear-gradient(#4cc0c4,#0e8a8f);border-radius:10px 10px 2px 2px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;right:0;bottom:0;background:#e0a93b}.val,.lab{font-size:11px;color:var(--muted);text-align:center}.val b{color:var(--text)}.lab{height:42px;line-height:1.25}
.chart-key{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:12px;flex-wrap:wrap}.chart-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.flow{display:grid;grid-template-columns:1fr 50px 1fr 50px 1.5fr;gap:8px;align-items:center}.node{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.node strong{display:block;font-size:31px;letter-spacing:-.03em}.node span{font-size:11px;color:var(--muted)}.node small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.arrow{text-align:center;color:#7aa3b0;font-size:25px}
.fates{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.fate{background:#e1f0f4;border-radius:11px;padding:11px}.fate.f-good{background:#d3ecec}.fate.f-bad{background:#fbe9e1}.fate b{font-size:21px;display:block;line-height:1.15}.fate small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:18px 0 8px}.stack i{display:block;height:100%}
.metal-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.notice{margin-top:14px;border-left:3px solid var(--copper);background:#fdf1e6;padding:12px 14px;border-radius:0 11px 11px 0;color:#6b4318;font-size:12px}
/* future */
.future{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;padding:25px 22px}.year{border-bottom:1px solid #b4d3de;padding:18px 4px}.year b{font-size:clamp(40px,6vw,76px);letter-spacing:-.06em;display:block;line-height:1.05}.year span{color:var(--muted);font-size:14px;display:block;margin-top:4px}
.trend{display:block;width:100%;height:auto;margin-top:6px}.trend .ax{stroke:var(--line)}.trend .gen{fill:none;stroke:var(--teal);stroke-width:2.6}.trend .genp{fill:none;stroke:var(--teal);stroke-width:2.6;stroke-dasharray:6 5}.trend .rec{fill:none;stroke:var(--gold);stroke-width:2.6}.trend .area{fill:#0e8a8f14}.trend text{font-size:11px;fill:#66808c}.trend .lbl{font-weight:700;fill:var(--text);font-size:12px}
.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.reg{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}.reg b{font-size:25px;display:block;letter-spacing:-.03em}.reg span{color:var(--muted);font-size:11px;display:block}.reg .barline{height:6px;margin:10px 0 4px}.reg .barline i{background:var(--gold)}

.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.source{display:block;border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;color:var(--text);text-decoration:none}.source:hover{border-color:#3aa3a8}.source span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.foot{padding:45px 0 75px;color:#66808c;font-size:11px}

.fields{width:100%;border-collapse:collapse;font-size:13px}.fields td{text-align:left;padding:8px 10px;border-bottom:1px solid #d6e8ee;vertical-align:top}.fields tr:last-child td{border-bottom:0}.fields td:first-child{font-family:ui-monospace,Consolas,monospace;color:var(--teal);white-space:nowrap}
/* map */
.mapbox{padding:20px}.map-controls{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.mpills{display:flex;flex-wrap:wrap;gap:6px}.mpill{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}.mpill:hover{border-color:#3aa3a8}.mpill.active{background:var(--teal);border-color:var(--teal);color:#fff}.map-toggles{display:flex;flex-wrap:wrap;gap:8px}.map-toggles .switch{margin-bottom:0}
.map-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}.map-wrap{position:relative;min-width:0}#worldMap{display:block;width:100%;height:auto;background:var(--soft2);border-radius:14px;border:1px solid #d6e8ee}.country{stroke:#fff;stroke-width:.5;cursor:pointer}.country:hover{stroke:#10293a;stroke-width:1}.country.sel{stroke:#10293a;stroke-width:1.6}
.map-tip{position:absolute;pointer-events:none;background:#10293a;color:#fff;border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.35;box-shadow:0 6px 18px #10293a33;white-space:nowrap;z-index:2}.map-tip b{display:block;font-size:13px}.map-tip span{color:#c9dfe7;display:block}
.map-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--muted)}.map-legend .lbar{display:block;width:min(220px,40vw);height:10px;border-radius:99px}.map-legend em{font-style:normal;flex-basis:100%}.map-legend .nd{display:inline-flex;align-items:center;gap:5px;margin-left:8px}.map-legend .nd i{width:10px;height:10px;border-radius:3px;background:#e3eaed;border:1px solid #cfdbe0}
.rleg{display:flex;flex-wrap:wrap;gap:4px 10px}.rleg button{border:0;background:none;padding:2px 0;font:inherit;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:5px}.rleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.map-side{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px}.ms-pick{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.ms-pick select{display:block;width:100%;margin-top:5px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--soft2);color:var(--text);font:inherit;font-size:14px;text-transform:none;letter-spacing:0}.ms-value{font-size:40px;font-weight:800;letter-spacing:-.05em;color:var(--teal);margin-top:12px;line-height:1.05}.ms-sub{font-size:12px;color:var(--muted)}.ms-share{font-size:12px;color:var(--text);margin-top:4px;font-weight:600}
.spark{display:block;width:100%;height:auto;margin-top:12px}.spark .ax{stroke:var(--line)}.spark .split{stroke:var(--line);stroke-dasharray:2 3}.spark .hist{fill:none;stroke:var(--teal);stroke-width:2.2}.spark .proj{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-dasharray:5 4;opacity:.8}.spark .now{stroke:#c0452f;stroke-width:1}.spark .dot{fill:#c0452f}.spark text{font-size:9px;fill:#66808c}

<section class="section" id="about"><div class="wrap"><div class="head"><div><div class="eyebrow">01 · About</div><h2>One traceable picture of the world's e-waste.</h2></div><p>E-Waste Atlas is a source-first data service on global electronic waste, developed by the From Waste to Resource (W2R) lab at the Technion. It brings trusted international datasets together in one place and keeps every number traceable to its source.</p></div>
<h3 class="about-sub">The problem it solves</h3><div class="cards"><div class="card"><div class="num">INVISIBLE</div><h3>Most flows are undocumented</h3><p>More than three-quarters of e-waste leaves no formal paper trail: it is stored, traded, informally recycled or thrown in the bin.</p></div><div class="card"><div class="num">INCOMPARABLE</div><h3>"Generated", "collected" and "recycled" differ</h3><p>Countries report different stages of the chain, and mixing them up leads to misleading comparisons.</p></div><div class="card"><div class="num">UNTRACEABLE</div><h3>Numbers lose their origin</h3><p>Once a figure is quoted and re-quoted, its year, method and whether it was measured or modelled are often lost.</p></div></div>
<h3 class="about-sub">How it works</h3><div class="grid2"><div class="panel"><p style="margin-top:0">The atlas does not produce its own estimates. It collects, labels and connects data published by international organisations (see <a href="#sources">Sources</a>), and follows e-waste as a material flow: which products it comes from, what materials it contains, where it is generated and how it is managed.</p><p style="margin-bottom:0">E-waste is defined as any discarded product with a plug or battery, grouped into six categories under the UN harmonised classification (with photovoltaic panels shown separately).</p></div><div class="panel"><table class="fields"><tbody><tr><td>source</td><td>The organisation and publication the value comes from.</td></tr><tr><td>version</td><td>Which release or edition of that source was used.</td></tr><tr><td>unit</td><td>What is counted, e.g. kilotonnes (kt), kg per capita or % share.</td></tr><tr><td>geography</td><td>World, continent, UN sub-region or country.</td></tr><tr><td>method</td><td>How the source produced the value.</td></tr><tr><td>status</td><td>Reported (measured) or modelled (estimated / projected).</td></tr></tbody></table></div></div>
<h3 class="about-sub">Who it is for</h3><div class="cards"><div class="card"><h3>Researchers and students</h3><p>A starting point for e-waste figures, with the original source always one click away.</p></div><div class="card"><h3>Policy and industry</h3><p>A consistent overview of where e-waste arises and how much is formally recovered, to support collection targets and EPR design.</p></div><div class="card"><h3>The public</h3><p>A clear, visual way to understand what happens to the devices we throw away.</p></div></div></div></section>

<section class="section" id="categories"><div class="wrap"><div class="head"><div><div class="eyebrow">02 · Products</div><h2>What becomes e-waste?</h2></div><p>E-waste is grouped by how it is collected and treated. Small household devices dominate by mass; lamps are the least recycled.</p></div><div class="grid2" data-ig="cats"><div class="tilegrid" id="catgrid"></div><div class="panel detail" id="catDetail"></div></div>
<div class="panel" style="margin-top:15px" data-ig="catchart"><div class="switch" id="catSwitch"><button class="active" data-mode="mass">Generated vs. recycled (Mt)</button><button data-mode="rate">Documented recycling rate</button></div><div class="chart" id="chart"></div><div class="chart-key" id="chartKey"></div></div></div></section>

<section class="section" id="materials"><div class="wrap"><div class="head"><div><div class="eyebrow">03 · Materials</div><h2>What is e-waste made of?</h2></div><p>The 62 Mt discarded in 2022 held metals worth an estimated US$91 billion — and hazardous substances that need careful handling.</p></div>
<div data-ig="comp"><div class="comp" role="img" aria-label="Composition of e-waste in 2022: 31 Mt metals, 17 Mt plastics, 14 Mt other materials"><div style="flex:31;background:#0e8a8f"><b>31 Mt</b><span>Metals</span></div><div style="flex:17;background:#55a7c4"><b>17 Mt</b><span>Plastics</span></div><div style="flex:14;background:#8aa1ad"><b>14 Mt</b><span>Other: glass, minerals, composites</span></div></div>
<div class="comp-row"><div class="vcard"><b>US$91 bn</b><span>Value of metals embedded in 2022 e-waste</span></div><div class="vcard"><b>US$28 bn</b><span>Secondary raw materials actually recovered</span></div><div class="vcard"><b>~1%</b><span>Share of rare-earth demand met by e-waste recycling</span></div></div>
</div><div class="grid2" data-ig="els"><div><div class="elgrid" id="elgrid"></div><div class="el-key"><span><i style="background:var(--teal)"></i>Mass contained in 2022 e-waste</span><span><i style="background:#b3412f"></i>Hazardous · mass released per year</span></div></div><div class="panel detail" id="elDetail"></div></div></div></section>

<section class="section" id="lifecycle"><div class="wrap"><div class="head"><div><div class="eyebrow">04 · Lifecycle</div><h2>Follow the device.</h2></div><p>Only a fifth of discarded electronics is documented as formally recycled. The rest is handled informally, traded, or ends up in residual waste.</p></div>
<div data-ig="life"><div class="panel flow"><div class="node"><span>E-WASTE GENERATED · 2022</span><strong>62 Mt</strong><small>7.8 kg per person, up 82% since 2010</small></div><div class="arrow">→</div><div class="node"><span>DOCUMENTED FORMAL RECYCLING</span><strong>13.8 Mt</strong><small>22.3% · 1.7 kg per person</small></div><div class="arrow">→</div><div class="fates"><div class="fate f-good"><b>13.8 Mt</b><small>Formally collected &amp; recycled (documented)</small></div><div class="fate"><b>16 Mt</b><small>Collected &amp; recycled outside formal systems, high/upper-middle-income countries</small></div><div class="fate f-bad"><b>18 Mt</b><small>Mostly informal handling in low/lower-middle-income countries</small></div><div class="fate f-bad"><b>14 Mt</b><small>Thrown in residual waste, mostly landfilled</small></div></div></div>
<div class="stack" role="img" aria-label="Fate shares"><i style="flex:13.8;background:#0e8a8f"></i><i style="flex:16;background:#55a7c4"></i><i style="flex:18;background:#e0a93b"></i><i style="flex:14;background:#c0652a"></i></div>
<div class="metal-flow"><div class="vcard"><b>31 Mt</b><span>metals contained</span></div><div class="vcard"><b>19 Mt</b><span>metals viably recovered</span></div><div class="vcard"><b>12 Mt</b><span>metals lost (non-compliant routes, process losses)</span></div><div class="vcard"><b>93 Mt CO₂e</b><span>avoided via recovery (41 Mt refrigerants, 52 Mt avoided mining)</span></div></div>
<div class="notice">Global E-waste Monitor 2024 estimates for 2022, rounded. About 5.1 Mt (8.2%) crossed borders, of which ~3.3 Mt moved from high-income to middle- and low-income countries in uncontrolled, undocumented shipments. Non-compliant management releases ~58 t of mercury and ~45 kt of plastics containing brominated flame retardants every year.</div></div></div></section>

<section class="section" id="future"><div class="wrap"><div class="head"><div><div class="eyebrow">06 · Time</div><h2>From 34 Mt to 82 Mt.</h2></div><p>E-waste grows by about 2.6 Mt a year — almost five times faster than documented recycling. The Monitor projects 82 Mt by 2030, while the documented recycling rate slips to 20%.</p></div>
<div class="panel" data-ig="trend"><svg class="trend" id="trend" viewBox="0 0 900 260" role="img" aria-label="Global e-waste generated and documented recycled, 2010 to 2030"></svg><div class="chart-key"><span><i style="background:var(--teal)"></i>Generated (solid: estimate, dashed: projection)</span><span><i style="background:var(--gold)"></i>Documented formally recycled</span></div></div>

 side.innerHTML='<label class="ms-pick">Sub-region<select id="mapSel"><option value="">World</option>'+ORDER.map(function(c){return '<option value="'+c+'"'+(c===r?' selected':'')+'>'+SUBN[c]+'</option>'}).join('')+'</select></label>'+
  '<div class="ms-value">'+fmt(v)+'</div><div class="ms-sub">'+sub+' · '+S.year+'</div>'+extra+spark(r)+
  '<div class="ms-key"><span class="k-h"></span>Estimate <span class="k-p"></span>Modelled</div><div class="ms-top">'+top+'</div>';
 $('mapSel').onchange=function(){select(this.value?+this.value:null)};
 side.querySelectorAll('.trow').forEach(function(b){b.onclick=function(){select(+b.dataset.r)}})}
function select(r){S.sel=r;paint(false)}
function setYear(y){S.year=Math.max(Y0,Math.min(Y1,y));paint(true)}
function syncButtons(){root.querySelectorAll('#mapScale button').forEach(function(b){b.classList.toggle('active',b.dataset.s===S.scale)});
 var gb=root.querySelector('#mapScale [data-s="growth"]');gb.disabled=S.m==='rr';if(S.m==='rr'&&S.scale==='growth')S.scale='abs',syncButtons();
 $('mapScale').style.display=S.view==='heat'?'':'none'}
root.querySelectorAll('#mapMetric .mpill').forEach(function(b){b.onclick=function(){
 root.querySelectorAll('#mapMetric .mpill').forEach(function(x){x.classList.toggle('active',x===b)});
 S.m=b.dataset.m;if(S.view==='regions'){S.view='heat';root.querySelectorAll('#mapView button').forEach(function(x){x.classList.toggle('active',x.dataset.v==='heat')})}
 syncButtons();buildScale();paint(false)}});
root.querySelectorAll('#mapView button').forEach(function(b){b.onclick=function(){root.querySelectorAll('#mapView button').forEach(function(x){x.classList.toggle('active',x===b)});S.view=b.dataset.v;syncButtons();paint(false)}});
root.querySelectorAll('#mapScale button').forEach(function(b){b.onclick=function(){if(b.disabled)return;S.scale=b.dataset.s;syncButtons();buildScale();paint(false)}});
slider.oninput=function(){stop();setYear(+slider.value)};
function stop(){if(S.timer){clearInterval(S.timer);S.timer=null;playBtn.textContent='▶';playBtn.setAttribute('aria-label','Play timeline')}}
playBtn.onclick=function(){if(S.timer)return stop();if(S.year>=Y1)S.year=Y0;
 playBtn.textContent='❚❚';playBtn.setAttribute('aria-label','Pause timeline');
 S.timer=setInterval(function(){if(S.year>=Y1)return stop();setYear(S.year+1)},380)};
function showTip(ev,d){if(!d.r){tip.hidden=true;return}
 tip.innerHTML='<b>'+d.n+'</b><span>'+SUBN[d.r]+'</span>'+(S.view==='regions'?'':'<span>'+fmt(value(d.r,S.year))+' · '+S.year+'</span>');
 var box=wrap.getBoundingClientRect(),x=ev.clientX-box.left,y=ev.clientY-box.top;
 tip.hidden=false;tip.style.left=Math.max(4,Math.min(x+14,box.width-tip.offsetWidth-4))+'px';tip.style.top=Math.max(4,y-tip.offsetHeight-10)+'px'}
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(function(r){return r.json()}).then(function(topo){
 var feats=topojson.feature(topo,topo.objects.countries).features.filter(function(f){return f.properties.name!=='Antarctica'});
 feats.forEach(function(f){f.r=ID2SUB[f.id]||NAME2SUB[f.properties.name]||null;f.n=f.properties.name});
 var proj=d3.geoNaturalEarth1().fitExtent([[6,6],[954,464]],{type:'FeatureCollection',features:feats}),gp=d3.geoPath(proj);
 paths=g.selectAll('path').data(feats).enter().append('path').attr('d',gp).attr('class','country')
  .on('mousemove',function(ev,d){showTip(ev,d)}).on('mouseleave',function(){tip.hidden=true})
  .on('click',function(ev,d){ev.stopPropagation();if(d.r)select(S.sel===d.r?null:d.r)});
 svg.on('click',function(){select(null)});
 syncButtons();buildScale();paint(false);
}).catch(function(e){console.error(e);wrap.innerHTML='<p class="map-err">The map could not be loaded. It needs an internet connection to fetch the world outlines.</p>'});

/* ---------- download infographics as PDF / JPEG ---------- */
var LAB_URL='https://w2r-lab.vercel.app/';
var GEM='Source: Global E-waste Monitor 2024 (Baldé et al., UNITAR / ITU), values for 2022 unless stated; rounded.';
var SDG='Source: UN SDG Global Database, indicators 12.4.2 / 12.5.1 (custodian UNITAR); regions per UN M49. 2023–2025 values are modelled.';
function activeName(sel,list,idx){var b=root.querySelector(sel+'.active');return b?list[+b.dataset.i][idx]:''}
var IG={
 clock:{t:function(){return 'E-waste clock'},s:function(){return 'Accumulation today at the 2022 rate of 62 Mt per year · exported '+new Date().toUTCString().slice(0,22)+' UTC'},src:GEM+' Illustrative rate conversion, not a real-time measurement.'},
 kpis:{t:function(){return 'Global e-waste at a glance'},s:function(){return 'Key figures, 2022 and 2030 projection'},src:GEM},
 cats:{t:function(){return 'What becomes e-waste? · '+activeName('#catgrid .tile',cats,1)},s:function(){return 'E-waste generated and documented as formally recycled, by product category, 2022'},src:GEM},
 catchart:{t:function(){return 'E-waste by product category'},s:function(){var m=root.querySelector('#catSwitch .active');return (m&&m.dataset.mode==='rate'?'Documented formal recycling rate':'Generated vs. documented formally recycled (Mt)')+', 2022'},src:GEM},
 comp:{t:function(){return 'What is e-waste made of?'},s:function(){return 'Material composition and metal value of the 62 Mt of e-waste generated in 2022'},src:GEM},
 els:{t:function(){return 'Elements in e-waste · '+activeName('#elgrid .el',els,1)},s:function(){return 'Mass contained in global e-waste, 2022 (mercury: mass released per year)'},src:GEM},
 life:{t:function(){return 'Where e-waste goes'},s:function(){return 'Fate of the 62 Mt of e-waste generated in 2022, metal recovery and avoided emissions'},src:GEM},
 map:{t:function(){return MET[S.m]+' · '+S.year+(S.sel?' · '+SUBN[S.sel]:'')},s:function(){return S.view==='regions'?'UN M49 geographic sub-regions':(S.scale==='growth'?'Growth since first year of data, ':'')+'by UN sub-region · '+tag(S.year)},src:SDG},
 trend:{t:function(){return 'Global e-waste, 2010–2030'},s:function(){return 'E-waste generated and documented as formally recycled (Mt)'},src:SDG+' 2030 projection: Global E-waste Monitor 2024.'},
 future:{t:function(){return 'From 34 Mt to 82 Mt'},s:function(){return 'Global e-waste generated, 2010, 2022 and 2030 projection'},src:GEM},
 regions:{t:function(){return 'E-waste by continent, 2022'},s:function(){return 'Generation per person and documented formal recycling rate'},src:GEM}};
var DLI='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>';
root.querySelectorAll('[data-ig]').forEach(function(el){var k=el.dataset.ig,row=document.createElement('div');
 row.className='dl-row'+(k==='kpis'?' kp':'');row.innerHTML='<span>Download</span><button type="button" data-f="pdf" aria-label="Download '+IG[k].t().replace(/"/g,'')+' as PDF">'+DLI+'PDF</button><button type="button" data-f="jpg" aria-label="Download as JPEG">'+DLI+'JPEG</button>';
 el.parentNode.insertBefore(row,el);
 row.querySelectorAll('button').forEach(function(b){b.onclick=function(){exportIG(el,k,b.dataset.f,row)}})});

var libs={};
function loadScript(u){return libs[u]||(libs[u]=new Promise(function(ok,bad){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=function(){delete libs[u];bad(new Error('Could not load '+u))};document.head.appendChild(s)}))}
function loadImg(src){return new Promise(function(ok,bad){var i=new Image();i.onload=function(){ok(i)};i.onerror=bad;i.src=src})}
function toDataURL(blob){return new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(r.result)};r.readAsDataURL(blob)})}
var fontCSS=null;
function getFontCSS(){ // embed the latin Figtree subset so exported files keep the page typeface
 return fontCSS||(fontCSS=fetch('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap').then(function(r){return r.text()}).then(function(css){
  var blocks=(css.match(/@font-face\s*{[^}]*}/g)||[]).filter(function(b){return /U\+0000-00FF/.test(b)});
  return Promise.all(blocks.map(function(b){var m=b.match(/url\(([^)]+)\)/);if(!m)return b;
   return fetch(m[1].replace(/['"]/g,'')).then(function(r){return r.blob()}).then(toDataURL).then(function(d){return b.replace(m[0],'url('+d+')')})})).then(function(a){return a.join('\n')})
 }).catch(function(){return ''}))}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)}
function wrapText(ctx,text,maxW){var words=text.split(' '),lines=[],line='';words.forEach(function(w){var t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t});if(line)lines.push(line);return lines}
function toast(msg){var t=document.createElement('div');t.className='dl-toast';t.textContent=msg;root.querySelector('.pa').appendChild(t);setTimeout(function(){t.remove()},3200)}
function save(href,name){var a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove()}

function compose(el,k){
 var F='Figtree, system-ui, sans-serif';
 return Promise.all([loadScript('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js'),getFontCSS(),document.fonts.ready,loadImg(LOGO_W2R),loadImg(LOGO_TECHNION)]).then(function(r){
  var css=r[1],badge=r[3],tech=r[4];
  var opts={pixelRatio:2,backgroundColor:'#eaf3f6',filter:function(n){return !(n.classList&&(n.classList.contains('map-tip')||n.classList.contains('timeline')||n.classList.contains('dl-row')||n.classList.contains('map-controls')||n.classList.contains('ms-pick')||n.classList.contains('switch')))}};
  if(css)opts.fontEmbedCSS=css;else opts.skipFonts=true;
  return htmlToImage.toCanvas(el,opts).then(function(img){
   var P=2,pad=40,cw=img.width/P,ch=img.height/P,W=Math.max(cw+pad*2,720),title=IG[k].t(),sub=IG[k].s();
   var m=document.createElement('canvas').getContext('2d');
   m.font='800 30px '+F;var tl=wrapText(m,title,W-pad*2);m.font='12px '+F;var sl=wrapText(m,IG[k].src,W-pad*2);
   var headH=pad+18+tl.length*36+26,srcH=sl.length*17+22,footH=92,H=headH+ch+18+srcH+footH;
   var c=document.createElement('canvas');c.width=W*P;c.height=H*P;var x=c.getContext('2d');x.scale(P,P);
   x.fillStyle='#eaf3f6';x.fillRect(0,0,W,H);x.textBaseline='alphabetic';
   x.fillStyle='#0e8a8f';x.font='800 12px '+F;if('letterSpacing' in x)x.letterSpacing='2px';x.fillText('E-WASTE ATLAS · W2R LAB',pad,pad+10);if('letterSpacing' in x)x.letterSpacing='0px';
   x.fillStyle='#10293a';x.font='800 30px '+F;tl.forEach(function(l,i){x.fillText(l,pad,pad+18+30+i*36)});
   x.fillStyle='#536b78';x.font='500 14px '+F;x.fillText(sub,pad,pad+18+tl.length*36+14);
   x.drawImage(img,(W-cw)/2,headH,cw,ch);
   var sy=headH+ch+18;x.strokeStyle='#c5dbe3';x.beginPath();x.moveTo(pad,sy);x.lineTo(W-pad,sy);x.stroke();
   x.fillStyle='#536b78';x.font='12px '+F;sl.forEach(function(l,i){x.fillText(l,pad,sy+18+i*17)});
   var fy=H-footH;x.fillStyle='#0d1b22';x.fillRect(0,fy,W,footH);x.fillStyle='#0e8a8f';x.fillRect(0,fy,W,3);
   var bs=60;x.drawImage(badge,pad,fy+(footH-bs)/2+1,bs,bs);
   x.fillStyle='#ffffff';x.font='700 17px '+F;var labTxt='From Waste to Resource (W2R) Lab';x.fillText(labTxt,pad+bs+16,fy+footH/2+7);var labW=bs+16+x.measureText(labTxt).width;
   var th=44,tw=th*tech.width/tech.height;if(tw>W*0.38){tw=W*0.38;th=tw*tech.height/tech.width}
   x.drawImage(tech,W-pad-tw,fy+(footH-th)/2+1,tw,th);
   return {canvas:c,w:W,h:H,title:title,sub:sub,link:[pad-4,fy+(footH-bs)/2-3,labW+8,bs+8]}})})}

function exportIG(el,k,fmtType,row){
 var btns=row.querySelectorAll('button');btns.forEach(function(b){b.disabled=true});
 var name='e-waste-atlas_'+slug(IG[k].t());
 compose(el,k).then(function(o){
  var jpg=o.canvas.toDataURL('image/jpeg',0.92);
  if(fmtType==='jpg'){save(jpg,name+'.jpg');return}
  return loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js').then(function(){
   var pdf=new jspdf.jsPDF({orientation:o.w>o.h?'l':'p',unit:'px',format:[o.w,o.h],hotfixes:['px_scaling'],compress:true});
   pdf.setProperties({title:'E-Waste Atlas · '+o.title,subject:o.sub,author:'W2R Lab, Technion – Israel Institute of Technology',creator:'E-Waste Atlas · '+LAB_URL});
   pdf.addImage(jpg,'JPEG',0,0,o.w,o.h);
   pdf.link(o.link[0],o.link[1],o.link[2],o.link[3],{url:LAB_URL}); // W2R badge + lab name link to the lab website
   pdf.save(name+'.pdf')})
 }).catch(function(e){console.error(e);toast('Export failed — it needs an internet connection to load the export tools.')})
 .then(function(){btns.forEach(function(b){b.disabled=false})})}

/* in-page links live inside the shadow root */
root.addEventListener('click',function(e){var a=e.target.closest('a[href^="#"]');if(!a)return;var t=root.getElementById(a.getAttribute('href').slice(1));if(!t)return;e.preventDefault();t.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+t.id)});
if(location.hash){var t0=root.getElementById(location.hash.slice(1));if(t0)setTimeout(function(){t0.scrollIntoView({block:'start'})},60)}
})();
</script>
